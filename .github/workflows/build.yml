name: Build KAD Remote (Kad.exe & Kad.ipa)

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Kad.exe & Headless Server Agent (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish GUI Host Kad.exe
        run: |
          dotnet publish windows/KADRemote.Host/KADRemote.Host.csproj -c Release -r win-x64 -o out/windows

      - name: Publish Headless Server Agent Kad.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = (dotnet publish windows/KADRemote.Agent/KADRemote.Agent.csproj -c Release -r win-x64 -o out/agent 2>&1) | ForEach-Object { "$_" }
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $errs = ($out | Select-String -Pattern "error " | Select-Object -First 8 | ForEach-Object { $_.Line.Trim() }) -join " | "
            if (-not $errs) { $errs = ($out | Select-Object -Last 8) -join " | " }
            Write-Host "::error::$errs"
            exit $code
          }

      - name: Update PE OptionalHeader CheckSum & Verify Windows Defender Clean
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class PeHelper {
              [DllImport("imagehlp.dll", CharSet = CharSet.Auto, SetLastError = true)]
              public static extern uint MapFileAndCheckSum(string Filename, out uint HeaderSum, out uint CheckSum);
          }
          "@
          foreach ($exePath in @("out/windows/Kad.exe", "out/agent/Kad.exe")) {
            $full = (Resolve-Path $exePath).Path
            [uint32]$hdrSum = 0
            [uint32]$calcSum = 0
            [PeHelper]::MapFileAndCheckSum($full, [ref]$hdrSum, [ref]$calcSum) | Out-Null
            $data = [System.IO.File]::ReadAllBytes($full)
            $peOffset = [BitConverter]::ToInt32($data, 0x3C)
            $csOffset = $peOffset + 24 + 64
            $csBytes = [BitConverter]::GetBytes($calcSum)
            [Buffer]::BlockCopy($csBytes, 0, $data, $csOffset, 4)
            [System.IO.File]::WriteAllBytes($full, $data)
            Write-Host ("Updated PE CheckSum for {0}: 0x{1:X8} (Size: {2:N2} MB)" -f $exePath, $calcSum, ($data.Length / 1MB))
          }

      - name: Upload Kad.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kad-Windows
          path: out/windows/Kad.exe

      - name: Upload Headless Agent template artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kad-Windows-Agent
          path: out/agent/Kad.exe

  build-ios:
    name: Build Kad.ipa (Unsigned iOS)
    needs: [ build-windows ]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Headless Agent Template into iOS Bundle Resources
        uses: actions/download-artifact@v4
        with:
          name: Kad-Windows-Agent
          path: ios/KADRemote/Sources/Resources

      - name: Rename Agent Template for iOS Bundle
        run: |
          mv ios/KADRemote/Sources/Resources/Kad.exe ios/KADRemote/Sources/Resources/KadAgentTemplate.exe
          ls -lh ios/KADRemote/Sources/Resources/KadAgentTemplate.exe

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/KADRemote
        run: xcodegen generate

      - name: Build unsigned Kad.app
        working-directory: ios/KADRemote
        run: |
          set -o pipefail
          xcodebuild \
            -project KADRemote.xcodeproj \
            -scheme Kad \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee xcodebuild.log || {
              ERRS=$(grep -E "error:" xcodebuild.log | head -n 10 | tr '\n' ' ')
              echo "::error::$ERRS"
              exit 1
            }

      - name: Verify KadAgentTemplate.exe bundled in Kad.app
        working-directory: ios/KADRemote
        run: |
          test -f build/Build/Products/Release-iphoneos/Kad.app/KadAgentTemplate.exe

      - name: Package unsigned Kad.ipa
        working-directory: ios/KADRemote
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/Kad.app out/Payload/
          cd out
          zip -r -y Kad.ipa Payload

      - name: Upload Kad.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kad-iOS-Unsigned
          path: ios/KADRemote/out/Kad.ipa

  release:
    name: Publish Release (Kad.exe & Kad.ipa)
    needs: [ build-windows, build-ios ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Kad.exe
        uses: actions/download-artifact@v4
        with:
          name: Kad-Windows
          path: release-assets

      - name: Download Kad.ipa
        uses: actions/download-artifact@v4
        with:
          name: Kad-iOS-Unsigned
          path: release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'KAD Remote Latest Build' }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/Kad.exe
            release-assets/Kad.ipa
